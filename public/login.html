<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Licence Reporting</title>
  <script src="/theme.js"></script>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand"><img src="/logo.png" alt="">Licence Reporting</div>
      <div class="alert warn"><span class="icon">!</span>
        <div><strong>Development sign-in.</strong> Pick a role to try the app as. Servers use Microsoft (Entra ID) sign-in.</div>
      </div>
      <form id="login-form">
        <div class="field">
          <label for="role">Sign in as</label>
          <select id="role" required>
            <option value="admin">Dev Admin (IT)</option>
            <option value="viewer">Dev Viewer (Finance)</option>
          </select>
        </div>
        <p id="error" class="hidden" style="color:var(--critical)"></p>
        <div class="actions" style="margin-top:14px">
          <button class="btn primary" type="submit">Sign in</button>
        </div>
      </form>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
